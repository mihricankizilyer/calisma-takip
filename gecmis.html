<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Çalışma Takip — Geçmiş kayıtlar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=redesign4" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      document.addEventListener("click", function (e) {
        var btn = e.target.closest && e.target.closest(".theme-toggle");
        if (!btn) return;
        var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        var next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e2) {}
        window.dispatchEvent(new CustomEvent("themechange", { detail: next }));
      });
    })();
  </script>
</head>
<body data-page="gecmis" class="page-gecmis">
  <div class="shell">
    <aside class="sidebar" aria-label="Ana menü">
      <div class="sidebar__top">
        <a href="index.html" class="sidebar__brand">
          <span class="sidebar__logo" aria-hidden="true">◆</span>
          <span class="sidebar__app-name">Çalışma Takip</span>
        </a>
      </div>
      <nav class="sidebar__nav">
        <span class="sidebar__group-label">Genel</span>
        <a href="index.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">🏠</span>Ana sayfa</a>
        <a href="yeni-kayit.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">➕</span>Yeni kayıt</a>
        <span class="sidebar__group-label">Çalışma</span>
        <a href="yds.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">🎯</span>YDS</a>
        <a href="teknik.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">💻</span>Teknik</a>
        <a href="kitaplar.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">📚</span>Kitaplar</a>
        <a href="notlarim.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">📝</span>Notlarım</a>
        <a href="yatirim.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">💹</span>Yatırım</a>
        <a href="calendar.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">📅</span>Takvim</a>
        <span class="sidebar__group-label">Hesap</span>
        <a href="giris.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">🔑</span>Giriş</a>
        <a href="ayarlar.html" class="sidebar__link"><span class="sidebar__link-ico" aria-hidden="true">⚙️</span>Ayarlar</a>
        <a href="gecmis.html" class="sidebar__link sidebar__link--active" aria-current="page"><span class="sidebar__link-ico" aria-hidden="true">🕘</span>Geçmiş kayıtlar</a>
      </nav>
    </aside>

    <div class="shell__main">
      <header class="header">
        <div class="header__brand header__brand--compact">
          <div>
            <h1 class="header__page-title">Geçmiş kayıtlar</h1>
          </div>
        </div>
        <div class="header__actions">
          <button type="button" class="theme-toggle" aria-label="Tema değiştir" title="Açık/Koyu tema">
            <span class="theme-toggle__moon" aria-hidden="true">🌙</span>
            <span class="theme-toggle__sun" aria-hidden="true">☀️</span>
          </button>
          <a href="yeni-kayit.html" class="btn btn--primary">Kayıt ekle</a>
          <button type="button" class="btn btn--ghost" id="btn-export" title="Veriyi JSON olarak indir">Dışa aktar</button>
          <label class="btn btn--ghost btn--file">
            İçe aktar
            <input type="file" id="import-file" accept="application/json" hidden />
          </label>
        </div>
      </header>

      <div class="shell__content shell__content--gecmis">
        <section class="panel panel--list panel--list-page panel--gecmis-list" aria-labelledby="list-title">
          <div class="panel__head-row panel__head-row--list">
            <div class="panel__head-text">
              <h2 id="list-title" class="panel__h2">Kayıtlar</h2>
              <p class="panel__sub">Kategori sekmesi ile süz — listeyi açıp kapatabilirsin</p>
            </div>
          </div>
          <div class="gecmis-records">
            <div class="gecmis-cat-tabs" role="tablist" aria-label="Kategori filtresi">
              <button type="button" class="gecmis-cat-tab gecmis-cat-tab--active" role="tab" data-gecmis-filter="" aria-selected="true">Tümü</button>
              <button type="button" class="gecmis-cat-tab gecmis-cat-tab--en" role="tab" data-gecmis-filter="english" aria-selected="false">YDS</button>
              <button type="button" class="gecmis-cat-tab gecmis-cat-tab--tech" role="tab" data-gecmis-filter="technical" aria-selected="false">Teknik</button>
              <button type="button" class="gecmis-cat-tab gecmis-cat-tab--book" role="tab" data-gecmis-filter="book" aria-selected="false">Kitap</button>
              <button type="button" class="gecmis-cat-tab gecmis-cat-tab--inv" role="tab" data-gecmis-filter="investment" aria-selected="false">Yatırım</button>
            </div>
            <details class="gecmis-records-panel records-collapsible" id="gecmis-records-panel">
              <summary class="gecmis-records-tab records-collapsible__summary">
                <span class="gecmis-records-tab__label">Kayıtlar</span>
                <span class="gecmis-records-tab__count" id="gecmis-records-count">0</span>
                <span class="records-collapsible__chev" aria-hidden="true"></span>
              </summary>
              <div class="gecmis-records-body">
                <ul class="session-list session-list--gecmis records-card-list" id="session-list"></ul>
                <p class="empty empty--gecmis" id="empty-msg">Kayıt yok. <a href="yeni-kayit.html">Ekle</a></p>
              </div>
            </details>
          </div>
        </section>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="js/sync-api.js" defer></script>
  <script src="js/app.js?v=redesign4" defer></script>
</body>
</html>
